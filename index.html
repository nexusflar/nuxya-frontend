<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuxya</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-primary: #313338;
      --bg-secondary: #2b2d31;
      --bg-tertiary: #1e1f22;
      --bg-accent: #35373c;
      --text-normal: #dbdee1;
      --text-muted: #949ba4;
      --text-header: #f2f3f5;
      --brand: #5865f2;
      --brand-hover: #4752c4;
      --danger: #da373c;
      --danger-hover: #a12828;
      --success: #23a55a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'gg sans', 'Helvetica Neue', Arial, sans-serif; }
    body { background: var(--bg-primary); color: var(--text-normal); display: flex; height: 100vh; overflow: hidden; }
    .auth-overlay { position: fixed; inset: 0; background: var(--bg-tertiary); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .auth-box { background: var(--bg-secondary); padding: 32px; border-radius: 8px; width: 420px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    .auth-box h2 { text-align: center; color: var(--text-header); font-size: 24px; font-weight: 700; }
    .auth-box input { background: var(--bg-tertiary); border: 1px solid rgba(0,0,0,0.3); color: var(--text-header); padding: 12px; border-radius: 4px; outline: none; font-size: 14px; }
    .auth-box input:focus { border-color: var(--brand); }
    .auth-box button { background: var(--brand); color: white; border: none; padding: 12px; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 14px; }
    .auth-box button:hover { background: var(--brand-hover); }
    .auth-toggle { text-align: center; color: #00a8fc; cursor: pointer; font-size: 13px; }
    .auth-toggle:hover { text-decoration: underline; }
    #app { display: none; width: 100vw; height: 100vh; }
    .sidebar { width: 260px; background: var(--bg-secondary); display: flex; flex-direction: column; justify-content: space-between; border-right: 1px solid #232428; flex-shrink: 0; }
    .sidebar-section { padding: 12px 8px 4px 12px; }
    .section-header { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.02em; margin-bottom: 6px; }
    .section-header button { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 16px; }
    .section-header button:hover { color: var(--text-header); }
    .list-container { max-height: 160px; overflow-y: auto; }
    .list-container::-webkit-scrollbar { width: 4px; }
    .list-container::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
    .item-row { padding: 8px 10px; border-radius: 4px; cursor: pointer; color: var(--text-muted); margin-bottom: 2px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 500; }
    .item-row:hover { background: var(--bg-accent); color: var(--text-normal); }
    .item-row.active { background: #3f4248; color: var(--text-header); }
    .user-footer { background: #232428; padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; }
    .user-info { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 4px; border-radius: 4px; flex: 1; margin-right: 6px; }
    .user-info:hover { background: var(--bg-accent); }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--brand); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #fff; font-size: 14px; flex-shrink: 0; object-fit: cover; }
    .user-details { display: flex; flex-direction: column; overflow: hidden; }
    .user-name { font-weight: 600; font-size: 13px; color: var(--text-header); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-status { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-primary); }
    .chat-header { height: 48px; border-bottom: 1px solid #232428; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-weight: 700; color: var(--text-header); font-size: 15px; }
    .chat-header .actions { display: flex; gap: 8px; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .chat-messages::-webkit-scrollbar { width: 8px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 4px; }
    .message { display: flex; gap: 16px; }
    .message-content { display: flex; flex-direction: column; flex: 1; }
    .message-header { display: flex; align-items: baseline; gap: 8px; }
    .message-author { font-size: 15px; font-weight: 600; color: var(--text-header); }
    .message-text { font-size: 14px; color: var(--text-normal); margin-top: 2px; line-height: 1.375; word-break: break-word; }
    .message-media img, .message-media video { max-width: 360px; max-height: 240px; border-radius: 8px; margin-top: 8px; }
    .chat-input-container { padding: 0 16px 24px 16px; display: flex; gap: 10px; align-items: center; }
    .chat-input-wrapper { flex: 1; background: #383a40; border-radius: 8px; display: flex; align-items: center; padding: 0 12px; }
    .chat-input { width: 100%; background: transparent; border: none; padding: 11px 0; color: var(--text-header); outline: none; font-size: 14px; }
    .attach-btn { background: transparent; border: none; color: #b5bac1; cursor: pointer; font-size: 18px; padding-right: 10px; }
    .attach-btn:hover { color: var(--text-header); }
    .chat-disabled-banner { flex: 1; background: #2b2d31; border-radius: 8px; padding: 12px; text-align: center; color: var(--text-muted); font-size: 14px; }
    .btn { background: var(--brand); color: #fff; padding: 6px 12px; border-radius: 3px; border: none; cursor: pointer; font-size: 13px; font-weight: 500; }
    .btn:hover { background: var(--brand-hover); }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-success { background: var(--success); }
    .btn-sm { padding: 3px 8px; font-size: 12px; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 2000; }
  </style>
</head>
<body>
  <!-- Auth -->
  <div id="auth-screen" class="auth-overlay">
    <div class="auth-box">
      <h2 id="auth-title">Log in to Nuxya</h2>
      <input type="text" id="auth-username" placeholder="Username" />
      <input type="password" id="auth-password" placeholder="Password" />
      <button id="auth-submit-btn" onclick="handleAuth()">Log In</button>
      <div class="auth-toggle" onclick="toggleAuthMode()">Need an account? Register</div>
    </div>
  </div>

  <!-- App -->
  <div id="app">
    <div class="sidebar">
      <div>
        <div class="sidebar-section">
          <div class="section-header">
            <span>Direct Messages</span>
            <button onclick="openModal('friend-modal')">+</button>
          </div>
          <div class="list-container" id="dms-list"></div>
        </div>
        <div class="sidebar-section">
          <div class="section-header">Friend Requests</div>
          <div class="list-container" id="requests-list"></div>
        </div>
        <div class="sidebar-section">
          <div class="section-header">Blocked</div>
          <div class="list-container" id="blocked-list"></div>
        </div>
        <div class="sidebar-section">
          <div class="section-header">
            <span>Groups</span>
            <button onclick="openModal('group-modal')">+</button>
          </div>
          <div class="list-container" id="groups-list"></div>
        </div>
      </div>
      <div class="user-footer">
        <div class="user-info" onclick="openProfileModal()">
          <img class="avatar" id="my-avatar-img" style="display:none;" />
          <div class="avatar" id="my-avatar-text">U</div>
          <div class="user-details">
            <div class="user-name" id="my-username">User</div>
            <div class="user-status" id="my-bio">Online</div>
          </div>
        </div>
        <button class="btn btn-danger btn-sm" onclick="logout()">Log Out</button>
      </div>
    </div>

    <div class="chat-area">
      <div class="chat-header">
        <span id="chat-title">Select a chat</span>
        <div class="actions" id="chat-actions"></div>
      </div>
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-container" id="chat-input-container">
        <div class="chat-input-wrapper">
          <input type="file" id="media-file" style="display:none" accept="image/*,video/*" onchange="handleFileUpload(event)" />
          <button class="attach-btn" onclick="document.getElementById('media-file').click()">📎</button>
          <input type="text" id="message-input" class="chat-input" placeholder="Send a message..." onkeydown="if(event.key==='Enter') sendMessage()" />
        </div>
        <button class="btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <!-- Modals -->
  <div id="friend-modal" class="modal">
    <div class="auth-box">
      <h2>Add Friend</h2>
      <input type="text" id="friend-username" placeholder="Exact username" />
      <button class="btn" onclick="sendFriendRequest()">Send Request</button>
      <button class="btn btn-danger" onclick="closeModal('friend-modal')">Close</button>
    </div>
  </div>

  <div id="group-modal" class="modal">
    <div class="auth-box">
      <h2>Create Group</h2>
      <input type="text" id="group-name" placeholder="Group Name" />
      <button class="btn" onclick="createGroup()">Create</button>
      <button class="btn btn-danger" onclick="closeModal('group-modal')">Cancel</button>
    </div>
  </div>

  <div id="profile-modal" class="modal">
    <div class="auth-box">
      <h2>My Profile</h2>
      <input type="text" id="profile-username" placeholder="Username" />
      <input type="text" id="profile-bio" placeholder="Bio / Status" />
      <input type="text" id="profile-avatar" placeholder="Avatar URL (or leave empty)" />
      <button class="btn" onclick="saveProfile()">Save</button>
      <button class="btn btn-danger" onclick="closeModal('profile-modal')">Cancel</button>
    </div>
  </div>

  <script>
    // ============ CONFIG ============
    const SUPABASE_URL = "https://jalapucopmgkzysqffsn.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_e19HZNohVPiCdu3xGA-ghQ_JR8lL90s";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ============ STATE ============
    let currentUser = null;          // { id, username, bio, avatar_url }
    let currentChat = null;          // { type: 'dm'|'group', id, title, otherUserId?, isOwner? }
    let isRegisterMode = false;
    let realtimeChannel = null;

    // ============ AUTH ============
    window.onload = async () => {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        await loadCurrentUser(session.user.id);
        initApp();
      }
    };

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-title').textContent = isRegisterMode ? 'Create a Nuxya Account' : 'Log in to Nuxya';
      document.getElementById('auth-submit-btn').textContent = isRegisterMode ? 'Register' : 'Log In';
    }

    async function handleAuth() {
      const username = document.getElementById('auth-username').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      if (!username || !password) return alert('Please fill in all fields');

      const email = `${username.toLowerCase()}@nuxya.local`;

      if (isRegisterMode) {
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: { data: { username } }
        });
        if (error) return alert(error.message);
        // Profile is created by the trigger
        await loadCurrentUser(data.user.id);
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) return alert(error.message);
        await loadCurrentUser(data.user.id);
      }
      initApp();
    }

    async function loadCurrentUser(userId) {
      const { data, error } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', userId)
        .single();
      if (error || !data) {
        alert('Could not load profile');
        return;
      }
      currentUser = data;
    }

    function logout() {
      supabase.auth.signOut();
      location.reload();
    }

    // ============ APP INIT ============
    function initApp() {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app').style.display = 'flex';
      updateProfileUI();
      refreshSidebar();
      // Poll as simple fallback + realtime for messages
      setInterval(refreshSidebar, 5000);
    }

    function updateProfileUI() {
      document.getElementById('my-username').textContent = currentUser.username;
      document.getElementById('my-bio').textContent = currentUser.bio || 'Online';
      const img = document.getElementById('my-avatar-img');
      const txt = document.getElementById('my-avatar-text');
      if (currentUser.avatar_url) {
        img.src = currentUser.avatar_url;
        img.style.display = 'block';
        txt.style.display = 'none';
      } else {
        txt.textContent = (currentUser.username || 'U')[0].toUpperCase();
        txt.style.display = 'flex';
        img.style.display = 'none';
      }
    }

    // ============ SIDEBAR ============
    async function refreshSidebar() {
      await Promise.all([loadFriendships(), loadGroups()]);
    }

    async function loadFriendships() {
      const { data: friendships } = await supabase
        .from('friendships')
        .select(`
          id, status, user_id, friend_id,
          user:profiles!friendships_user_id_fkey(id, username, avatar_url),
          friend:profiles!friendships_friend_id_fkey(id, username, avatar_url)
        `)
        .or(`user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`);

      const dmsList = document.getElementById('dms-list');
      const reqList = document.getElementById('requests-list');
      const blockedList = document.getElementById('blocked-list');
      dmsList.innerHTML = '';
      reqList.innerHTML = '';
      blockedList.innerHTML = '';

      if (!friendships) return;

      for (const f of friendships) {
        const isSender = f.user_id === currentUser.id;
        const other = isSender ? f.friend : f.user;
        if (!other) continue;

        if (f.status === 'blocked') {
          if (isSender) {
            blockedList.innerHTML += `
              <div class="item-row">
                <span>@${other.username}</span>
                <button class="btn btn-sm" onclick="unblockUser('${f.id}')">Unblock</button>
              </div>`;
          }
          continue;
        }

        if (f.status === 'pending') {
          if (!isSender) {
            reqList.innerHTML += `
              <div class="item-row">
                <span>@${other.username}</span>
                <div>
                  <button class="btn btn-success btn-sm" onclick="acceptFriend('${f.id}')">✓</button>
                  <button class="btn btn-danger btn-sm" onclick="blockUser('${f.id}')">✕</button>
                </div>
              </div>`;
          }
          continue;
        }

        // accepted
        const active = currentChat && currentChat.type === 'dm' && currentChat.id === f.id;
        dmsList.innerHTML += `
          <div class="item-row ${active ? 'active' : ''}"
               onclick="selectChat('dm', '${f.id}', '@${other.username}', '${other.id}')">
            <span>@${other.username}</span>
          </div>`;
      }
    }

    async function loadGroups() {
      const { data: memberships } = await supabase
        .from('group_members')
        .select('group_id, role, groups(id, name, created_by)')
        .eq('user_id', currentUser.id);

      const groupsList = document.getElementById('groups-list');
      groupsList.innerHTML = '';
      if (!memberships) return;

      for (const m of memberships) {
        const g = m.groups;
        if (!g) continue;
        const active = currentChat && currentChat.type === 'group' && currentChat.id === g.id;
        groupsList.innerHTML += `
          <div class="item-row ${active ? 'active' : ''}"
               onclick="selectChat('group', '${g.id}', '# ${g.name}', null, ${m.role === 'owner'})">
            <span># ${g.name}</span>
          </div>`;
      }
    }

    // ============ FRIENDS ============
    async function sendFriendRequest() {
      const targetName = document.getElementById('friend-username').value.trim();
      if (!targetName || targetName.toLowerCase() === currentUser.username.toLowerCase()) {
        return alert('Invalid username');
      }

      const { data: target } = await supabase
        .from('profiles')
        .select('id')
        .ilike('username', targetName)
        .single();

      if (!target) return alert('User not found');

      // Check existing relationship
      const { data: existing } = await supabase
        .from('friendships')
        .select('*')
        .or(`and(user_id.eq.${currentUser.id},friend_id.eq.${target.id}),and(user_id.eq.${target.id},friend_id.eq.${currentUser.id})`);

      if (existing && existing.length > 0) {
        return alert('Friendship already exists or is pending/blocked');
      }

      const { error } = await supabase.from('friendships').insert({
        user_id: currentUser.id,
        friend_id: target.id,
        status: 'pending'
      });

      if (error) alert(error.message);
      else {
        alert('Request sent!');
        closeModal('friend-modal');
        refreshSidebar();
      }
    }

    async function acceptFriend(id) {
      await supabase.from('friendships').update({ status: 'accepted' }).eq('id', id);
      refreshSidebar();
    }

    async function blockUser(id) {
      // Who is blocking becomes the user_id side for simplicity
      await supabase.from('friendships').update({
        status: 'blocked',
        user_id: currentUser.id
      }).eq('id', id);

      // Clear messages for this DM
      await supabase.from('messages').delete()
        .eq('channel_type', 'dm')
        .eq('channel_id', id);

      if (currentChat && currentChat.type === 'dm' && currentChat.id === id) {
        clearChat();
      }
      refreshSidebar();
    }

    async function unblockUser(id) {
      await supabase.from('friendships').delete().eq('id', id);
      refreshSidebar();
    }

    async function unfriendUser(id) {
      await supabase.from('friendships').delete().eq('id', id);
      if (currentChat && currentChat.type === 'dm' && currentChat.id === id) {
        clearChat();
      }
      refreshSidebar();
    }

    // ============ GROUPS ============
    async function createGroup() {
      const name = document.getElementById('group-name').value.trim();
      if (!name) return alert('Name required');

      const { data: group, error } = await supabase
        .from('groups')
        .insert({ name, created_by: currentUser.id })
        .select()
        .single();

      if (error) return alert(error.message);

      // Add creator as owner
      await supabase.from('group_members').insert({
        group_id: group.id,
        user_id: currentUser.id,
        role: 'owner'
      });

      closeModal('group-modal');
      refreshSidebar();
    }

    async function leaveOrDeleteGroup() {
      if (!currentChat || currentChat.type !== 'group') return;

      if (currentChat.isOwner) {
        // Owner deletes the whole group (cascade removes members + messages if you set ON DELETE)
        await supabase.from('groups').delete().eq('id', currentChat.id);
      } else {
        // Member just leaves
        await supabase.from('group_members')
          .delete()
          .eq('group_id', currentChat.id)
          .eq('user_id', currentUser.id);
      }
      clearChat();
      refreshSidebar();
    }

    // ============ CHAT ============
    function clearChat() {
      currentChat = null;
      document.getElementById('chat-title').textContent = 'Select a chat';
      document.getElementById('chat-messages').innerHTML = '';
      document.getElementById('chat-actions').innerHTML = '';
      document.getElementById('chat-input-container').innerHTML = `
        <div class="chat-input-wrapper">
          <input type="file" id="media-file" style="display:none" accept="image/*,video/*" onchange="handleFileUpload(event)" />
          <button class="attach-btn" onclick="document.getElementById('media-file').click()">📎</button>
          <input type="text" id="message-input" class="chat-input" placeholder="Send a message..." onkeydown="if(event.key==='Enter') sendMessage()" />
        </div>
        <button class="btn" onclick="sendMessage()">Send</button>
      `;
      if (realtimeChannel) {
        supabase.removeChannel(realtimeChannel);
        realtimeChannel = null;
      }
    }

    function selectChat(type, id, title, otherUserId = null, isOwner = false) {
      currentChat = { type, id, title, otherUserId, isOwner };
      document.getElementById('chat-title').textContent = title;

      let actionsHTML = '';
      if (type === 'dm') {
        actionsHTML = `
          <button class="btn btn-sm" onclick="unfriendUser('${id}')">Unfriend</button>
          <button class="btn btn-danger btn-sm" onclick="blockUser('${id}')">Block</button>
        `;
      } else {
        actionsHTML = `
          <button class="btn btn-danger btn-sm" onclick="leaveOrDeleteGroup()">
            ${isOwner ? 'Delete Group' : 'Leave Group'}
          </button>
        `;
      }
      document.getElementById('chat-actions').innerHTML = actionsHTML;

      // Restore input
      document.getElementById('chat-input-container').innerHTML = `
        <div class="chat-input-wrapper">
          <input type="file" id="media-file" style="display:none" accept="image/*,video/*" onchange="handleFileUpload(event)" />
          <button class="attach-btn" onclick="document.getElementById('media-file').click()">📎</button>
          <input type="text" id="message-input" class="chat-input" placeholder="Send a message..." onkeydown="if(event.key==='Enter') sendMessage()" />
        </div>
        <button class="btn" onclick="sendMessage()">Send</button>
      `;

      loadMessages();
      subscribeToMessages();
    }

    async function loadMessages() {
      if (!currentChat) return;
      const { data } = await supabase
        .from('messages')
        .select(`
          id, content, media_url, created_at, sender_id,
          sender:profiles(username, avatar_url)
        `)
        .eq('channel_type', currentChat.type)
        .eq('channel_id', currentChat.id)
        .order('created_at', { ascending: true });

      const box = document.getElementById('chat-messages');
      box.innerHTML = '';
      if (data) data.forEach(msg => appendMessage(msg));
    }

    function subscribeToMessages() {
      if (realtimeChannel) supabase.removeChannel(realtimeChannel);

      realtimeChannel = supabase
        .channel(`messages:${currentChat.type}:${currentChat.id}`)
        .on(
          'postgres_changes',
          {
            event: 'INSERT',
            schema: 'public',
            table: 'messages',
            filter: `channel_id=eq.${currentChat.id}`
          },
          payload => {
            // Only append if it belongs to this channel type
            if (payload.new.channel_type === currentChat.type) {
              // Fetch sender info
              supabase
                .from('profiles')
                .select('username, avatar_url')
                .eq('id', payload.new.sender_id)
                .single()
                .then(({ data: sender }) => {
                  appendMessage({ ...payload.new, sender });
                });
            }
          }
        )
        .subscribe();
    }

    async function sendMessage(mediaUrl = null) {
      if (!currentChat) return alert('Select a chat first');
      const input = document.getElementById('message-input');
      const content = input ? input.value.trim() : '';
      if (!content && !mediaUrl) return;

      const { error } = await supabase.from('messages').insert({
        channel_type: currentChat.type,
        channel_id: currentChat.id,
        sender_id: currentUser.id,
        content: content || null,
        media_url: mediaUrl
      });

      if (error) alert('Error sending: ' + error.message);
      else if (input) input.value = '';
    }

    async function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const ext = file.name.split('.').pop();
      const path = `${currentUser.id}/${Date.now()}.${ext}`;

      const { error: uploadError } = await supabase.storage
        .from('media')
        .upload(path, file);

      if (uploadError) return alert('Upload failed: ' + uploadError.message);

      const { data: { publicUrl } } = supabase.storage
        .from('media')
        .getPublicUrl(path);

      await sendMessage(publicUrl);
      e.target.value = ''; // reset
    }

    function appendMessage(msg) {
      const box = document.getElementById('chat-messages');
      const author = msg.sender?.username || 'User';
      const div = document.createElement('div');
      div.className = 'message';

      let mediaHTML = '';
      if (msg.media_url) {
        const isVideo = msg.media_url.match(/\.(mp4|webm|mov)$/i);
        mediaHTML = isVideo
          ? `<div class="message-media"><video src="${msg.media_url}" controls style="max-width:360px;max-height:240px;border-radius:8px;margin-top:8px;"></video></div>`
          : `<div class="message-media"><img src="${msg.media_url}" /></div>`;
      }

      div.innerHTML = `
        <div class="avatar">${author[0].toUpperCase()}</div>
        <div class="message-content">
          <div class="message-header">
            <span class="message-author">${author}</span>
          </div>
          ${msg.content ? `<div class="message-text">${escapeHtml(msg.content)}</div>` : ''}
          ${mediaHTML}
        </div>
      `;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ============ PROFILE ============
    function openProfileModal() {
      document.getElementById('profile-username').value = currentUser.username;
      document.getElementById('profile-bio').value = currentUser.bio || '';
      document.getElementById('profile-avatar').value = currentUser.avatar_url || '';
      openModal('profile-modal');
    }

    async function saveProfile() {
      const newUsername = document.getElementById('profile-username').value.trim();
      const newBio = document.getElementById('profile-bio').value.trim();
      const newAvatar = document.getElementById('profile-avatar').value.trim();

      if (!newUsername) return alert('Username required');

      const { error } = await supabase
        .from('profiles')
        .update({
          username: newUsername,
          bio: newBio,
          avatar_url: newAvatar || null
        })
        .eq('id', currentUser.id);

      if (error) return alert(error.message);

      currentUser.username = newUsername;
      currentUser.bio = newBio;
      currentUser.avatar_url = newAvatar || null;
      updateProfileUI();
      closeModal('profile-modal');
      refreshSidebar();
    }

    // ============ MODALS ============
    function openModal(id) {
      document.getElementById(id).style.display = 'flex';
    }
    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }
  </script>
</body>
</html>
